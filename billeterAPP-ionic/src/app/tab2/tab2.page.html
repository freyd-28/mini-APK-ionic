<ion-header>
  <ion-toolbar color="primary">
    <ion-title>
      Categorías
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>

    <ion-card-header>
      <ion-card-title>
        {{ editingId ? 'Editar categoría' : 'Nueva categoría' }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-input
        label="Nombre *"
        labelPlacement="stacked"
        [(ngModel)]="nombre">
      </ion-input>

      <ion-button
        (click)="save()"
        [disabled]="!nombre.trim()">
        {{ editingId ? 'Actualizar' : 'Crear' }}
      </ion-button>

      <ion-button
        fill="clear"
        *ngIf="editingId"
        (click)="nuevo()">
        Cancelar
      </ion-button>

    </ion-card-content>

  </ion-card>

  <ion-text
    color="danger"
    *ngIf="error">

    <p>
      {{ error }}
    </p>

  </ion-text>

  <ion-list>

    <ion-item *ngFor="let x of items">

      <ion-label>

        <h2>
          {{ x.nombre }}
        </h2>

        <p>
          ID: {{ x.id_categoria }}
        </p>

      </ion-label>

      <ion-button
        slot="end"
        fill="clear"
        (click)="edit(x)">
        Editar
      </ion-button>

      <ion-button
        slot="end"
        color="danger"
        fill="clear"
        (click)="remove(x)">
        Borrar
      </ion-button>

    </ion-item>

  </ion-list>

</ion-content>
